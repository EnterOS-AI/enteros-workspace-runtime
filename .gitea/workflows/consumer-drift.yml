name: consumer-drift

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-ssot-consumers:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Check consumers do not vendor runtime source
        env:
          GITEA_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::DISPATCH_TOKEN secret is required for cross-repo consumer drift checks"
            exit 1
          fi
          python scripts/check_consumer_runtime_drift.py

      - name: Check platform communication contract
        env:
          GITEA_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::DISPATCH_TOKEN secret is required for cross-repo communication drift checks"
            exit 1
          fi
          python scripts/check_platform_comm_contract.py
