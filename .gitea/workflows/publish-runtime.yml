name: publish-runtime

on:
  push:
    tags:
      - "runtime-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-runtime
  cancel-in-progress: false

env:
  GITEA_URL: https://git.moleculesai.app
  GITEA_PYPI_SIMPLE_URL: https://git.moleculesai.app/api/packages/molecule-ai/pypi/simple/
  GITEA_PYPI_UPLOAD_URL: https://git.moleculesai.app/api/packages/molecule-ai/pypi/

jobs:
  publish:
    runs-on: publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      wheel_sha256: ${{ steps.wheel_hash.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Derive version + stamp pyproject (tag is source of truth)
        id: version
        # TAG-ONLY auto-release (2026-06-10): the auto-release workflow cannot commit
        # a pyproject bump to `main` (PR-only branch: enable_push:false +
        # required_approvals:2), so it now only cuts the `runtime-v<next>` tag. That
        # means pyproject.toml on `main` LAGS the tag. When this build is triggered by
        # a `runtime-v*` tag, the TAG is the source of truth: we STAMP the tag's
        # version into pyproject.toml at build time (ephemeral, in-CI — never
        # committed) so the wheel carries the correct version by construction. The old
        # hard-fail on tag!=pyproject is gone (it becomes trivially true after the
        # stamp). On manual workflow_dispatch (no tag) we fall back to whatever
        # pyproject already declares.
        run: |
          set -eu
          STAMP_FROM_TAG=0
          if echo "$GITHUB_REF" | grep -q "^refs/tags/runtime-v"; then
            VERSION="${GITHUB_REF#refs/tags/runtime-v}"
            STAMP_FROM_TAG=1
          else
            VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.+-]+)?$'; then
            echo "::error::version $VERSION does not look like a PEP 440 release"
            exit 1
          fi
          if [ "$STAMP_FROM_TAG" = "1" ]; then
            # Ephemeral, in-CI stamp — NOT committed back to the repo. After this the
            # built wheel/sdist carry $VERSION regardless of what main's pyproject says.
            VERSION="$VERSION" python - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          with open("pyproject.toml", "r", encoding="utf-8") as f:
              text = f.read()
          new, n = re.subn(
              r'(?m)^(version\s*=\s*)"[^"]+"',
              r'\g<1>"' + version + '"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('could not locate a single version = "..." line in pyproject.toml')
          with open("pyproject.toml", "w", encoding="utf-8") as f:
              f.write(new)
          print(f"stamped pyproject [project].version = {version} (ephemeral build-time)")
          PY
          fi
          PYPROJECT_VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          # After the stamp this is trivially equal; we keep the read as a sanity
          # assertion (catches a botched stamp) rather than a policy gate on main.
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::after stamp, build version $VERSION != pyproject $PYPROJECT_VERSION (stamp failed?)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing molecules-workspace-runtime $VERSION to Gitea package registry"

      - name: Build wheel + sdist
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Capture wheel SHA256
        id: wheel_hash
        run: |
          set -eu
          WHEEL=$(ls dist/*.whl | head -1)
          HASH=$(sha256sum "$WHEEL" | awk '{print $1}')
          echo "wheel_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "Wheel: $(basename "$WHEEL")"
          echo "SHA256: $HASH"

      # KMS migration (RFC: Gitea-Actions-secrets -> Infisical/KMS): source the
      # canonical Gitea package-publisher token from the Infisical SSOT via the
      # CI machine identity, mirroring the proven REST-fetch pattern (#971 /
      # #3274 and the molecule-app sop-checklist-gate wave-2 pilot). The
      # consolidated least-privilege credential is MOL_PACKAGE_TOKEN (a Gitea PAT
      # with `write:package` scope owned by the `pypi-publisher` persona) in the
      # prod /ci/gitea-pypi-publisher folder. It is exported to $GITHUB_ENV so
      # the publish step below references it via env.* in the SAME job.
      #
      # POSITIVE CONTROL: Infisical is the AUTHORITATIVE source for this
      # credential, so this step uses `set -uo pipefail`, a null-safe JSON
      # extractor, and an explicit non-empty assertion to HARD-FAIL on a
      # broken/empty/404/auth-failure fetch. We do NOT fall back to a Gitea
      # secret here: a broken authoritative fetch must surface loudly rather
      # than be silently masked.
      - name: Fetch Gitea package-publisher token from Infisical SSOT
        id: pypi_publisher_creds
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -uo pipefail
          BASE="https://key.moleculesai.app"
          if [ -z "${INFISICAL_CI_CLIENT_ID:-}" ] || [ -z "${INFISICAL_CI_CLIENT_SECRET:-}" ] || [ -z "${INFISICAL_PROJECT_ID:-}" ]; then
            echo "::error::Infisical CI machine identity (INFISICAL_CI_CLIENT_ID / INFISICAL_CI_CLIENT_SECRET / INFISICAL_CI_PROJECT_ID) is not set -- cannot fetch publisher creds from the SSOT"
            exit 1
          fi
          TOK=$(curl -fsS -X POST "$BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CI_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CI_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); v=d.get("accessToken"); print(v if isinstance(v,str) and v else "")')
          if [ -z "${TOK}" ]; then
            echo "::error::Infisical universal-auth login returned no accessToken -- authoritative fetch cannot proceed"
            exit 1
          fi
          # Null-safe extractor: never KeyErrors; prints empty string when the
          # secret (or any nesting level) is missing, so the [ -z ] guard below
          # is the single fail-closed decision point.
          read_secret() {
            curl -fsS "$BASE/api/v3/secrets/raw/$1?workspaceId=$INFISICAL_PROJECT_ID&environment=prod&secretPath=$2" \
              -H "Authorization: Bearer $TOK" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); v=(d.get("secret") or {}).get("secretValue"); print(v if isinstance(v,str) and v else "")'
          }
          MOL_PACKAGE_TOKEN=$(read_secret MOL_PACKAGE_TOKEN %2Fci%2Fgitea-pypi-publisher)
          if [ -z "${MOL_PACKAGE_TOKEN}" ]; then
            echo "::error::Infisical returned empty for MOL_PACKAGE_TOKEN at /ci/gitea-pypi-publisher (prod) -- authoritative fetch failed; failing loudly"
            exit 1
          fi
          echo "::add-mask::$MOL_PACKAGE_TOKEN"
          echo "MOL_PACKAGE_TOKEN=$MOL_PACKAGE_TOKEN" >> "$GITHUB_ENV"
          # Sentinel: prove non-empty without ever printing a value (length only).
          echo "Gitea package-publisher token loaded from Infisical (token len=${#MOL_PACKAGE_TOKEN})"

      - name: Publish to Gitea package registry
        env:
          # KMS migration: consumed from $GITHUB_ENV (written by the Infisical
          # fetch step above) rather than a duplicated Gitea Actions secret.
          MOL_PACKAGE_TOKEN: ${{ env.MOL_PACKAGE_TOKEN }}
        run: |
          set -eu
          # Canonical least-privilege publisher identity (write:package). The
          # Gitea package registry authenticates the token; the username is the
          # token owner (`pypi-publisher`).
          PUBLISHER_USER="pypi-publisher"
          if [ -z "${MOL_PACKAGE_TOKEN:-}" ]; then
            echo "::error::Gitea package registry publisher token is not set (Infisical fetch step did not export it)"
            exit 1
          fi
          # Idempotent publish: a re-run of this workflow (e.g. to re-execute the
          # downstream propagate job) must not hard-fail on the already-published
          # version. twine --skip-existing is NOT usable here -- twine hard-rejects
          # it for the Gitea registry ("UnsupportedConfiguration", broke v0.3.18).
          # Instead pre-check the registry simple index for every dist file and
          # skip the upload when all are already present.
          SIMPLE_BASE="${GITEA_PYPI_UPLOAD_URL%/}/simple"
          missing=0
          for f in dist/*; do
            base=$(basename "$f")
            pkg=$(printf %s "$base" | cut -d- -f1 | tr _ -)
            if curl -fsS -u "$PUBLISHER_USER:$MOL_PACKAGE_TOKEN" \
                 "$SIMPLE_BASE/$pkg/" 2>/dev/null | grep -qF "$base"; then
              echo "::notice::$base already in registry"
            else
              missing=1
            fi
          done
          if [ "$missing" = "0" ]; then
            echo "::notice::all dist files already published (re-run) -- skipping upload"
          else
            python -m twine upload \
              --repository-url "$GITEA_PYPI_UPLOAD_URL" \
              --username "$PUBLISHER_USER" \
              --password "$MOL_PACKAGE_TOKEN" \
              dist/*
          fi

      - name: Verify install from Gitea registry
        env:
          RUNTIME_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA256: ${{ steps.wheel_hash.outputs.wheel_sha256 }}
          # runtime#2429: molecule_runtime validates WORKSPACE_ID at import time.
          # The smoke must verify the wheel installs correctly without requiring
          # a real workspace. A dummy ID satisfies validation without weakening
          # the install check — the import still exercises the installed package.
          WORKSPACE_ID: dummy-smoke-verify
        run: |
          set -eu
          python -m venv /tmp/runtime-registry-smoke
          PIP=/tmp/runtime-registry-smoke/bin/pip
          PY=/tmp/runtime-registry-smoke/bin/python
          $PIP install --upgrade --quiet pip
          # HERMETIC (runtime#219 root cause): the Gitea index does NOT proxy
          # public PyPI (behavior lost in the 2026-06-28 box migration), so a
          # bare private --index-url 404s the runtime's PUBLIC transitive deps
          # (a2a-sdk/starlette/uvicorn/…) — the wheel uploads fine in the step
          # above, then THIS step fails, which fails the publish job and
          # SKIPS the propagate job (needs: publish) on every release. The
          # private index stays primary (it is the only source of the runtime
          # dist — the name is absent from public PyPI); pypi.org is the extra
          # index for the public deps, the fleet-standard pattern (#218,
          # template ci fixes, lark publish.yml).
          $PIP install \
            --index-url "$GITEA_PYPI_SIMPLE_URL" \
            --extra-index-url "https://pypi.org/simple/" \
            --no-cache-dir \
            "molecules-workspace-runtime==$RUNTIME_VERSION"
          INSTALLED=$($PIP show molecules-workspace-runtime | awk -F': ' '/^Version:/{print $2}')
          if [ "$INSTALLED" != "$RUNTIME_VERSION" ]; then
            echo "::error::installed $INSTALLED, want $RUNTIME_VERSION"
            exit 1
          fi
          $PY -c "from molecule_runtime.main import main_sync; from molecule_runtime.mcp_cli import main; print('runtime registry smoke OK')"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## publish-runtime $(date -u +%FT%TZ)"
            echo
            echo "**Version:** \`${{ steps.version.outputs.version }}\`"
            echo "**Registry:** \`$GITEA_PYPI_SIMPLE_URL\`"
            echo "**Wheel SHA256:** \`${{ steps.wheel_hash.outputs.wheel_sha256 }}\`"
            echo
            echo "PyPI is intentionally not part of this release path."
          } >> "$GITHUB_STEP_SUMMARY"

  propagate:
    # runtime#91: deterministically surface a .runtime-version bump PR on each
    # consumer template behind the just-published release, so consumers never
    # drift silently. Humans still gate the merge (normal 1-approval); the job
    # only removes the discovery + hand-authoring toil. consumer-drift stays the
    # backstop. PRs are opened purely via the Gitea contents+pulls API (no git
    # clone, so the token never lands in an on-disk clone URL) and the bump is
    # idempotent (skips already-pinned / existing-branch / open-PR).
    runs-on: publish
    needs: publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # CI bot-token consolidation (RFC: Gitea-Actions-secrets -> Infisical/KMS,
      # mirrors #971 / #3274): source the molecule-runtime-release-bot token from
      # the Infisical SSOT (/shared/runtime-bot, key RUNTIME_BOT_TOKEN) via the CI
      # machine identity, instead of the per-repo Gitea Actions secret
      # DISPATCH_TOKEN. The fetched value is exported to $GITHUB_ENV under
      # DISPATCH_TOKEN — the exact env var name the consumer step + the
      # propagate script (--token-env DISPATCH_TOKEN) already read — so nothing
      # downstream changes.
      #
      # ABSENT -> REPORT-ONLY DEGRADE PRESERVED (runtime#83): if the bootstrap
      # INFISICAL_CI_* creds are absent (a config gap), this step warns and exports
      # nothing, so the propagate script degrades to report-only (exits 0) rather
      # than painting runtime main red. When the creds ARE present, Infisical is
      # AUTHORITATIVE: a broken/empty/404 fetch hard-fails here so a broken
      # migration cannot masquerade as a green report-only no-op.
      - name: Fetch RUNTIME_BOT_TOKEN from Infisical SSOT
        id: runtime_bot_token
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${INFISICAL_CI_CLIENT_ID:-}" ] || [ -z "${INFISICAL_CI_CLIENT_SECRET:-}" ] || [ -z "${INFISICAL_PROJECT_ID:-}" ]; then
            echo "::warning::INFISICAL_CI_* bootstrap creds absent; cannot fetch RUNTIME_BOT_TOKEN. propagate will degrade to report-only (config gap, runtime#83). Provision INFISICAL_CI_CLIENT_ID/_CLIENT_SECRET/_PROJECT_ID to enable real bump PRs."
            exit 0
          fi
          BASE="https://key.moleculesai.app"
          TOK=$(curl -fsS -X POST "$BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CI_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CI_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);v=d.get("accessToken");print(v if isinstance(v,str) and v else "")')
          if [ -z "${TOK}" ]; then
            echo "::error::Infisical universal-auth login returned no accessToken -- creds present but auth failed; this is a real infra fault, failing loudly instead of degrading." >&2
            exit 1
          fi
          read_secret() {
            curl -fsS "$BASE/api/v3/secrets/raw/$1?workspaceId=$INFISICAL_PROJECT_ID&environment=prod&secretPath=$2" \
              -H "Authorization: Bearer $TOK" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);v=(d.get("secret") or {}).get("secretValue");print(v if isinstance(v,str) and v else "")'
          }
          RUNTIME_BOT_TOKEN=$(read_secret RUNTIME_BOT_TOKEN %2Fshared%2Fruntime-bot)
          if [ -z "${RUNTIME_BOT_TOKEN}" ]; then
            echo "::error::Infisical returned empty for RUNTIME_BOT_TOKEN at /shared/runtime-bot (prod) -- creds present but authoritative fetch failed; failing loudly so a broken migration cannot masquerade as a green report-only no-op." >&2
            exit 1
          fi
          echo "::add-mask::$RUNTIME_BOT_TOKEN"
          # Export under DISPATCH_TOKEN — the name the consumer step + script expect.
          echo "DISPATCH_TOKEN=$RUNTIME_BOT_TOKEN" >> "$GITHUB_ENV"
          echo "RUNTIME_BOT_TOKEN loaded from Infisical /shared/runtime-bot (non-empty, len=${#RUNTIME_BOT_TOKEN})"

      - name: Open .runtime-version bump PRs on consumer templates
        env:
          # Now sourced from the Infisical SSOT (/shared/runtime-bot,
          # RUNTIME_BOT_TOKEN) by the fetch step above and exported to $GITHUB_ENV
          # under DISPATCH_TOKEN — the name scripts/propagate_runtime_version.py
          # (--token-env DISPATCH_TOKEN) already reads. The old per-repo Gitea
          # secret DISPATCH_TOKEN is kept in place until a green run validates this
          # path (validate-before-delete).
          DISPATCH_TOKEN: ${{ env.DISPATCH_TOKEN }}
          RUNTIME_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          # runtime#83: when DISPATCH_TOKEN is absent (Infisical fetch skipped on
          # absent bootstrap creds) the script degrades to report-only (warns,
          # lists the consumers that would be bumped, exits 0) instead of
          # hard-failing — a missing-secret config gap must not paint runtime main
          # red. When present, it opens the bump PRs for real.
          python scripts/propagate_runtime_version.py --version "$RUNTIME_VERSION"
