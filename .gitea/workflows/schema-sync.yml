# schema-sync — keep the vendored plugin-manifest JSON-Schema in
# molecule_runtime/contracts/ byte-identical to its molecule-ai-sdk
# (contracts/) SSOT original.
#
# manifest_ssot.py (the advisory plugin-manifest gate, molecule-core#3383)
# validates plugin.yaml against molecule_runtime/contracts/
# plugin-manifest.schema.json (vendored from molecule-ai-sdk contracts/). This
# gate re-fetches the schema from molecule-ai-sdk (contracts/) main and diffs
# it against the vendored copy, failing the build on drift. Mirrors
# molecule-ci's schema-sync gate (itself modelled on this repo's #196
# vendored workspace-comms schemas). See molecule_runtime/contracts/PROVENANCE.md.
#
# Soft-skips (exit 2) on a TRANSPORT failure so a transient git.* TLS stall does
# not paint PRs red. A real byte difference fails (exit 1) — and so, since
# runtime#379, does an HTTP 4xx: a mapped SDK path that no longer resolves means
# the mirror is UNCHECKED, which the old `curl -fsS` reported as a soft skip and
# therefore as green. See the classifier table in the script's header.

name: Schema Sync

on:
  pull_request:
    paths:
      - "molecule_runtime/contracts/**"
      # The gate's MAP spans BOTH vendored roots; this one was mapped but not
      # triggered on, so editing contracts/mcp-plugin-delivery.contract.json in a
      # PR ran no drift check at all — the same unchecked-mirror hole as the 404
      # soft-skip, arrived at through the trigger instead of the fetch.
      - "contracts/**"
      - "scripts/check-schemas-in-sync.sh"
      - ".gitea/workflows/schema-sync.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  schema-sync:
    name: Vendored schemas in sync with molecule-ai-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4
      - name: Check vendored schemas against molecule-ai-sdk main
        run: |
          set +e
          bash scripts/check-schemas-in-sync.sh
          rc=$?
          set -e
          # rc 2 = TRANSPORT failure / forge 5xx. Soft-skip so a transient git.*
          # stall isn't a false red; rc 1 (real drift, or a 4xx meaning the mapped
          # SDK path does not resolve) fails.
          if [ "$rc" -eq 2 ]; then
            echo "::warning::schema-sync soft-skipped (could not fetch molecule-ai-sdk contracts main)."
            exit 0
          fi
          exit "$rc"
