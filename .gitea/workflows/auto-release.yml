name: auto-release

# CTO standing directive (2026-06-10): a GREEN package-affecting merge to `main`
# must AUTO-release the runtime and publish to prod. Test, docs, and CI-only
# merges finish successfully without creating a no-op package version. A manual
# workflow dispatch deliberately overrides classification and forces a release.
#
# TAG-ONLY design (root cause, 2026-06-10): `main` is strictly PR-only — branch
# protection sets `enable_push: false` + `required_approvals: 2`, so NO identity (not
# even the release bot) may push a commit directly to `main`. The previous design
# committed a `pyproject.toml` version bump to `main` via the contents API; that PUT
# is a direct push to a protected branch and FAILED every run (~17s). So this
# workflow now does NOT touch `main` at all: on a green merge it only CUTS THE TAG
# `runtime-v<target>` at `main` HEAD via the Gitea tags API. The target is the
# higher of latest-tag patch+1 and the reviewed pyproject version floor. Tag creation targets the
# TAG ref, not the branch ref, so branch push protection does not block it (proven:
# the manual `runtime-v0.3.14` cut returned HTTP 201 with this same release token).
#
# `pyproject.toml` on `main` LAGS the tag by design — publish-runtime.yml writes the
# tag's version into pyproject at build time (ephemeral, in-CI) before `python -m
# build`, so the wheel carries the correct version by construction. The lag is
# cosmetic.
#
# Release → prod chain this kicks off (mapped in the SOP PR body):
#   merge to main → THIS workflow re-runs the merge-blocking gates inline and, on
#   green, pushes tag runtime-v<target> at main HEAD → publish-runtime.yml (existing,
#   tag-triggered) writes the tag version into pyproject + builds+publishes the wheel
#   to the Gitea PyPI registry, and its `propagate` job opens `.runtime-version` bump
#   PRs on each consumer template → merging a template bump trips that template's
#   publish-image.yml (on: push main) which pip-installs the pinned wheel into a fresh
#   image, pushes ECR :latest + :sha-<7>, and auto-promotes the digest into the
#   control-plane `runtime_image_pins` (prod + staging). Agents boot from the promoted
#   pinned image — the runtime is baked at image-build, NOT pip-installed at boot — so
#   the auto-release is only fully "in prod" once the template image rebuilds + the pin
#   promotes.
#
# WHY re-run the gate here instead of `on: workflow_run`: Gitea (1.22.x..1.26.2) has
# NO `workflow_run` trigger (same limitation that forced publish-image.yml's
# promote-pin to be an in-workflow job). So a release workflow cannot subscribe to the
# `ci` workflow's success. We re-run the two merge-BLOCKING gates (unit-tests +
# responsiveness-e2e) inline and only release if BOTH pass — making "release on green"
# self-contained and not dependent on an unavailable event.
#
# LOOP SAFETY (structural): this workflow makes NO commit to `main`, and the only
# write it performs is the TAG push. A tag push does NOT match `on: push:
# branches:[main]`, so cutting the tag never re-enters this workflow at all — it only
# trips publish-runtime.yml. No bot-actor / `[skip-bump]` commit guard is needed
# anymore (there is no commit to guard against).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize releases; never cancel an in-flight release.
  group: auto-release
  cancel-in-progress: false

env:
  GITEA_URL: https://git.moleculesai.app

jobs:
  classify:
    name: Release decision
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_decision.outputs.should_release }}
      reason: ${{ steps.release_decision.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Classify package-affecting changes
        id: release_decision
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 .gitea/scripts/classify_runtime_release.py

  # Re-run the two merge-BLOCKING gates inline so we release ONLY on green.
  # (Mirrors ci.yml's unit-tests + responsiveness-e2e jobs verbatim.)
  unit-tests:
    name: Gate — unit-tests
    needs: classify
    if: ${{ needs.classify.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        # HERMETIC — mirrors ci.yml post-#212: no PIP_INDEX_URL=private
        # override (every dep is public + the package builds from local
        # source; the private index served none of them, so a cold cache
        # 404'd this gate and SKIPPED every release after #212 landed).
        # The [test] extra adds jsonschema for the workspace-comms
        # conformance tests, same as ci.yml.
        run: pip install -e ".[test]" pytest pytest-asyncio
      - name: Run unit tests
        run: pytest -q --ignore=tests/integration

  responsiveness-e2e:
    name: Gate — responsiveness-e2e
    needs: classify
    if: ${{ needs.classify.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        # HERMETIC — mirrors ci.yml post-#212: no PIP_INDEX_URL=private
        # override (every dep is public + the package builds from local
        # source; the private index served none of them, so a cold cache
        # 404'd this gate and SKIPPED every release after #212 landed).
        # The [test] extra adds jsonschema for the workspace-comms
        # conformance tests, same as ci.yml.
        run: pip install -e ".[test]" pytest pytest-asyncio
      - name: Run agent-responsiveness-under-load e2e
        env:
          RESP_E2E_A_BUSY_SECONDS: "50"
          RESP_E2E_STALE_WINDOW_SECONDS: "20"
          RESP_E2E_HEARTBEAT_INTERVAL: "4"
          RESP_E2E_FAST_ACK_CEILING: "5"
          RESP_E2E_IDLE_CAP: "3"
          RESP_E2E_POLL_DEADLINE: "25"
        run: pytest -q tests/integration

  release:
    name: Cut runtime-v<target> tag at main HEAD
    needs: [classify, unit-tests, responsiveness-e2e]
    if: ${{ needs.classify.outputs.should_release == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # the only write is the TAG, via the API + RUNTIME_BOT_TOKEN
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # CI bot-token consolidation (RFC: Gitea-Actions-secrets -> Infisical/KMS,
      # mirrors #971 / #3274): source the molecule-runtime-release-bot token from
      # the Infisical SSOT (/shared/runtime-bot, key RUNTIME_BOT_TOKEN) via the CI
      # machine identity, instead of the per-repo Gitea Actions secret
      # RELEASE_BOT_TOKEN. RELEASE_BOT_TOKEN and DISPATCH_TOKEN across this repo
      # were the SAME bot identity, so they collapse to one consolidated cred
      # (RUNTIME_BOT). The fetched value is exported to $GITHUB_ENV under the env
      # var name the consumer step already expects (RELEASE_BOT_TOKEN) so
      # scripts/auto_release_runtime.py --token-env RELEASE_BOT_TOKEN is unchanged.
      #
      # FAIL-CLOSED (release/tag job): Infisical is now the AUTHORITATIVE source
      # for this token. A broken/empty/404 fetch hard-fails here — a release must
      # never proceed (or silently no-op) on a broken authoritative fetch.
      - name: Fetch RUNTIME_BOT_TOKEN from Infisical SSOT
        id: runtime_bot_token
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -uo pipefail
          BASE="https://key.moleculesai.app"
          TOK=$(curl -fsS -X POST "$BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CI_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CI_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);v=d.get("accessToken");print(v if isinstance(v,str) and v else "")')
          if [ -z "${TOK}" ]; then
            echo "::error::Infisical universal-auth login returned no accessToken -- cannot fetch RUNTIME_BOT_TOKEN; failing the release fail-closed." >&2
            exit 1
          fi
          read_secret() {
            curl -fsS "$BASE/api/v3/secrets/raw/$1?workspaceId=$INFISICAL_PROJECT_ID&environment=prod&secretPath=$2" \
              -H "Authorization: Bearer $TOK" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);v=(d.get("secret") or {}).get("secretValue");print(v if isinstance(v,str) and v else "")'
          }
          RUNTIME_BOT_TOKEN=$(read_secret RUNTIME_BOT_TOKEN %2Fshared%2Fruntime-bot)
          if [ -z "${RUNTIME_BOT_TOKEN}" ]; then
            echo "::error::Infisical returned empty for RUNTIME_BOT_TOKEN at /shared/runtime-bot (prod) -- authoritative fetch failed; failing the release loudly (fail-closed)." >&2
            exit 1
          fi
          echo "::add-mask::$RUNTIME_BOT_TOKEN"
          # Export under the name the consumer/script already expects so nothing breaks.
          echo "RELEASE_BOT_TOKEN=$RUNTIME_BOT_TOKEN" >> "$GITHUB_ENV"
          echo "RUNTIME_BOT_TOKEN loaded from Infisical /shared/runtime-bot (non-empty, len=${#RUNTIME_BOT_TOKEN})"

      - name: Compute next version + cut tag at main HEAD
        env:
          # molecule-runtime-release-bot identity with write on this repo, now
          # sourced from the Infisical SSOT (/shared/runtime-bot, RUNTIME_BOT_TOKEN)
          # by the fetch step above and exported to $GITHUB_ENV under the name
          # RELEASE_BOT_TOKEN that scripts/auto_release_runtime.py expects. The
          # token only needs repository Read+Write to create a tag; it never
          # pushes to main. The old per-repo Gitea secret RELEASE_BOT_TOKEN is
          # kept in place until a green run validates this path (validate-before-delete).
          RELEASE_BOT_TOKEN: ${{ env.RELEASE_BOT_TOKEN }}
        run: |
          set -eu
          if [ -z "${RELEASE_BOT_TOKEN:-}" ]; then
            echo "::error::RELEASE_BOT_TOKEN empty after Infisical fetch — cannot auto-release. Check the 'Fetch RUNTIME_BOT_TOKEN from Infisical SSOT' step and /shared/runtime-bot."
            exit 1
          fi
          python scripts/auto_release_runtime.py --token-env RELEASE_BOT_TOKEN
