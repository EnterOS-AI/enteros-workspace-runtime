name: auto-release

# CTO standing directive (2026-06-10): a GREEN merge to `main` must AUTO-bump the
# runtime version and publish to prod — no manual `runtime-v*` tag / approval gate.
#
# Release → prod chain this kicks off (mapped in the SOP PR body):
#   merge to main → THIS workflow re-runs the merge-blocking gates inline and, on
#   green, bumps pyproject + pushes tag runtime-v<next> → publish-runtime.yml
#   (existing, tag-triggered) builds+publishes the wheel to the Gitea PyPI
#   registry and its `propagate` job opens `.runtime-version` bump PRs on each
#   consumer template → merging a template bump trips that template's
#   publish-image.yml (on: push main) which pip-installs the pinned wheel into a
#   fresh image, pushes ECR :latest + :sha-<7>, and auto-promotes the digest into
#   the control-plane `runtime_image_pins` (prod + staging). Agents boot from the
#   promoted pinned image — the runtime is baked at image-build, NOT pip-installed
#   at boot — so the auto-bump is only fully "in prod" once the template image
#   rebuilds + the pin promotes.
#
# WHY re-run the gate here instead of `on: workflow_run`: Gitea (1.22.x..1.26.2)
# has NO `workflow_run` trigger (same limitation that forced publish-image.yml's
# promote-pin to be an in-workflow job). So a release workflow cannot subscribe to
# the `ci` workflow's success. We re-run the two merge-BLOCKING gates
# (unit-tests + responsiveness-e2e) inline and only release if BOTH pass — making
# "release on green" self-contained and not dependent on an unavailable event.
#
# LOOP GUARD (dual, documented):
#   1. Bot-actor skip: the bump commit + tag are created by the
#      molecule-runtime-release-bot identity (RELEASE_BOT_TOKEN) via the Gitea
#      contents/tags API. The very next `push: main` event therefore has
#      github.actor == that bot → the `guard` job below short-circuits.
#   2. Message skip: the bump commit message carries `[skip-bump]`; the guard also
#      skips when HEAD's message contains it. Belt-and-suspenders in case the bot
#      actor name ever changes.
#   3. The TAG push does NOT match `on: push: branches:[main]`, so cutting the tag
#      never re-enters this workflow at all — only publish-runtime.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize releases; never cancel an in-flight release (a cancelled tag-cut
  # could strand a half-bumped pyproject).
  group: auto-release
  cancel-in-progress: false

env:
  GITEA_URL: https://git.moleculesai.app
  # The bot whose name we skip on, kept in one place for the guard + the docs.
  RELEASE_BOT_LOGIN: molecule-runtime-release-bot

jobs:
  guard:
    name: Loop guard (skip bot / [skip-bump] commits)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: decide
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          MSG="$(git log -1 --pretty=%B || true)"
          proceed=true
          if [ "${ACTOR}" = "${RELEASE_BOT_LOGIN}" ]; then
            echo "::notice::actor is ${RELEASE_BOT_LOGIN} (release bot) — skip to avoid loop"
            proceed=false
          fi
          if printf '%s' "$MSG" | grep -qF '[skip-bump]'; then
            echo "::notice::HEAD commit carries [skip-bump] — skip to avoid loop"
            proceed=false
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

  # Re-run the two merge-BLOCKING gates inline so we release ONLY on green.
  # (Mirrors ci.yml's unit-tests + responsiveness-e2e jobs verbatim.)
  unit-tests:
    name: Gate — unit-tests
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        env:
          PIP_INDEX_URL: https://git.moleculesai.app/api/packages/molecule-ai/pypi/simple/
        run: pip install -e . pytest pytest-asyncio
      - name: Run unit tests
        run: pytest -q --ignore=tests/integration

  responsiveness-e2e:
    name: Gate — responsiveness-e2e
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        env:
          PIP_INDEX_URL: https://git.moleculesai.app/api/packages/molecule-ai/pypi/simple/
        run: pip install -e . pytest pytest-asyncio
      - name: Run agent-responsiveness-under-load e2e
        env:
          RESP_E2E_A_BUSY_SECONDS: "50"
          RESP_E2E_STALE_WINDOW_SECONDS: "20"
          RESP_E2E_HEARTBEAT_INTERVAL: "4"
          RESP_E2E_FAST_ACK_CEILING: "5"
          RESP_E2E_IDLE_CAP: "3"
          RESP_E2E_POLL_DEADLINE: "25"
        run: pytest -q tests/integration

  release:
    name: Bump pyproject + cut runtime-v<next> tag
    needs: [guard, unit-tests, responsiveness-e2e]
    if: ${{ needs.guard.outputs.proceed == 'true' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # all writes go through the API + RELEASE_BOT_TOKEN
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Compute next version, bump pyproject, cut tag
        env:
          # molecule-runtime-release-bot identity with write on this repo.
          # The SAME bot used by publish-runtime.yml's propagate job
          # (DISPATCH_TOKEN). Provision RELEASE_BOT_TOKEN as a repo/org secret
          # holding that bot's token (NOT a founder PAT —
          # feedback_per_agent_gitea_identity_default).
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -eu
          if [ -z "${RELEASE_BOT_TOKEN:-}" ]; then
            echo "::error::RELEASE_BOT_TOKEN secret not configured — cannot auto-release. Provision the molecule-runtime-release-bot token (write on this repo)."
            exit 1
          fi
          python scripts/auto_release_runtime.py --token-env RELEASE_BOT_TOKEN
