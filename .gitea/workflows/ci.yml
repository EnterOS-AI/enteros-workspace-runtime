name: ci

# Standalone-as-SSOT CI (post-migration 2026-05-20).
#
# This repo became the single source of truth for the molecule-runtime
# Python package as of the standalone-as-SSOT migration (issue #87
# follow-on, CTO-GO 2026-05-20). Edit Python under molecule_runtime/
# directly here; the monorepo workspace-server pins this wheel by
# version.
#
# Old mirror-guard CI removed — direct PRs are the canonical edit path.

on:
  push:
    branches: [main, staging]
  pull_request:
  # Dispatch lane for the LIVE Langfuse obs-smoke (needs the running local
  # stack + Infisical creds, which only the on-box runner has). On a generic
  # runner the smoke self-gates to SKIP, so it is also safe on push/PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # HERMETIC (CI-robustness): no PIP_INDEX_URL=private override. Every
        # dep here is PUBLIC (ruff/build/twine/pytest/a2a-sdk/starlette/uvicorn)
        # and the package under test is built from LOCAL source — the private
        # index served none of them, so cold-cache 404d the required gate.
        run: |
          # Install the editable package so CI exercises pyproject.toml's
          # runtime dependency contract. This intentionally catches SDK/API
          # drift in package-local adapter tests, not only tests under tests/.
          # The `[test]` extra adds jsonschema for the workspace-comms
          # schema-conformance gate (tests/test_workspace_comms_conformance.py).
          pip install -e ".[test]" pytest pytest-asyncio

      - name: Run unit tests
        # Exclude the over-the-wire responsiveness e2e (its own job below) —
        # it boots real uvicorn servers and a 50s busy window, too slow for
        # the fast unit lane.
        run: pytest -q --ignore=tests/integration

      - name: Run channel-plugin local A2A contract gate
        # runtime#215 PR-2: real Unix HTTP binding, source prove-fail,
        # private filesystem modes, standard JSON-RPC + SSE passthrough, and
        # fail-closed capability removal must stay merge-blocking and loud.
        run: pytest -v -rs tests/test_channel_sdk_contract.py tests/test_channel_events.py tests/test_plugin_daemons.py

      - name: Check vendored channel client against molecule-ai-sdk
        # The runtime hosts the private socket without depending on the SDK at
        # runtime. Its provider-facing client is therefore an exact vendored
        # copy, checked against the exact reviewed SDK contract commit.
        run: |
          sdk_source="$(mktemp)"
          trap 'rm -f "$sdk_source"' EXIT
          curl -fsS -A curl/8.4.0 \
            https://git.moleculesai.app/api/v1/repos/molecule-ai/molecule-ai-sdk/raw/molecule_plugin/channel.py?ref=9372b57ac9dcebd92a40b2844ed0cba23e029ee2 \
            -o "$sdk_source"
          bash scripts/check-channel-sdk-vendor.sh "$sdk_source"

      - name: Run build_routes real-subprocess regression gate
        # Explicit, loud step for issue #88: the 4-branch build_routes contract
        # must be exercised against the REAL a2a-sdk in child processes. A skip
        # here means the real SDK is missing and the gate is inert.
        run: pytest -v -rs tests/test_boot_routes_subprocess.py

      - name: Run plugin-fetch REAL-GIT regression gate
        # Loud, merge-blocking, UNMOCKED gate for the SHA-pin incident
        # (staging test5, 2026-07-13). Every other test in test_plugin_sources
        # monkeypatches subprocess.run, and THAT is how the bug shipped: the
        # fake happily accepted `git clone --branch <sha>` and returned a tree,
        # while real git rejects a bare object id outright. CI was validating
        # the fetcher against a git that does not exist, so it stayed green
        # while every SHA-pinned plugin was unfetchable in production — which
        # then starved the concierge of its management MCP and parked the agent
        # in `failed`.
        #
        # These cases shell out to the REAL git binary against a REAL repo and
        # fetch a REAL commit id whose branch tip has moved PAST the pin, so
        # they cannot pass unless the pin is genuinely resolved. `-rs` makes a
        # SKIP loud: if git is missing from the runner the gate is inert, and
        # an inert gate must not read as green.
        run: pytest -v -rs tests/test_plugin_sources.py -k real_git

      - name: Run delegation-harvest active-await scoping regression gate
        # Loud, merge-blocking gate for the concierge delegation-result
        # RE-NARRATION loop (root fix, supersedes the watermark band-aid): the
        # heartbeat harvester must surface a result ONLY for a delegation the
        # concierge has an OPEN in-flight await for. Pins: a peer's autonomous/
        # scheduled-sweep result is NOT harvested; a user-awaited result is
        # delivered exactly once; a fresh boot re-narrates ZERO of a historical
        # backlog; a restart does not re-deliver.
        run: pytest -v -rs tests/test_heartbeat_harvest_active_await.py tests/test_heartbeat_notify_routing.py

      - name: Run session-continuity convergence gate
        # Loud, merge-blocking gate for the user expectation (2026-07-24):
        # "across any reason a workspace restarts or a plugin is installed, the
        # session stays the same." Every runtime self-wake (idle / harvester /
        # delegation-result / cron / scheduler / goal-nudge / boot initial_prompt
        # + reprovision announce) is POSTed via build_message_send_params; before
        # the fix it carried NO contextId, so the a2a-sdk minted a fresh
        # context_id per tick and TracingExecutor filed each under its own
        # throwaway Langfuse session (the "sessions still fragment after a plugin
        # install" report). This pins BOTH halves end-to-end — the builder stamps
        # canvas-<ws> on any self-* turn, and a self-wake + a canvas turn emit ONE
        # session_id. Runtime-agnostic (fix lives in molecule_runtime → all
        # adapters). -rs so a mis-collect surfaces loudly instead of green-passing.
        run: pytest -v -rs tests/test_self_turn_session_convergence.py

  responsiveness-e2e:
    # Deterministic, merge-BLOCKING integration gate for the "busy agent
    # becomes unreachable / blocks ~300s" regression class (2026-06-10).
    #
    # It drives a REAL RuntimeA2AExecutor mounted in REAL a2a-sdk JSON-RPC
    # Starlette routes served by REAL uvicorn, over REAL HTTP, and asserts:
    #   (a) a concurrent same-context POST fast-acks (no head-of-line block)
    #       — locks in the non-blocking flip (#116);
    #   (b) the agent never goes 'stale' across a busy window that EXCEEDS
    #       the old 45s stale threshold — locks in the stale-window fix;
    #   (c) both turns complete + the agent recovers to idle;
    #   (d) a tool that hangs past the per-turn idle cap is bounded and the
    #       executor recovers instead of wedging — locks in A1 tool-timeout.
    #
    # No external creds / infra (localhost only + a scripted, LLM-free
    # agent), so it is a deterministic merge gate — NOT a gated-nightly.
    # The integration conftest LOUD-SKIPS (never silent-passes) if the real
    # a2a-sdk wheel is somehow absent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # HERMETIC (CI-robustness): no PIP_INDEX_URL=private override. Every
        # dep here is PUBLIC (ruff/build/twine/pytest/a2a-sdk/starlette/uvicorn)
        # and the package under test is built from LOCAL source — the private
        # index served none of them, so cold-cache 404d the required gate.
        run: |
          # -e . pulls the REAL a2a-sdk[http-server] + starlette + uvicorn +
          # httpx so the e2e exercises the production wire, not stubs.
          pip install -e . pytest pytest-asyncio

      - name: Run agent-responsiveness-under-load e2e
        # CI-tuned timings: the busy window (50s) still comfortably EXCEEDS
        # the asserted stale window (20s), so the >45s-stale-window contract
        # is genuinely exercised, while keeping the job ~1 min. All timings
        # are env-tunable so a slower runner can widen slack without code
        # edits.
        env:
          RESP_E2E_A_BUSY_SECONDS: "50"
          RESP_E2E_STALE_WINDOW_SECONDS: "20"
          RESP_E2E_HEARTBEAT_INTERVAL: "4"
          RESP_E2E_FAST_ACK_CEILING: "5"
          RESP_E2E_IDLE_CAP: "3"
          RESP_E2E_POLL_DEADLINE: "25"
        run: pytest -q tests/integration

      - name: Run LIVE plugin-fetch gate (real git, real forge, real SHA)
        # The e2e for the test5 incident (2026-07-13): a plugin pinned to a
        # commit SHA could not be fetched at all (`clone --branch <sha>` resolves
        # ref NAMES, never an object id), the failed source aborted the whole
        # tree swap, the concierge's management MCP went down with it, and the
        # agent fail-closed to `failed`. Nothing mocked here — it fetches the
        # ACTUAL commit from the ACTUAL forge, so it fails for the same reason
        # production did.
        #
        # `-rs` is load-bearing: the step above runs `pytest -q`, where a SKIP is
        # SILENT. If the forge is unreachable from a runner this gate would then
        # quietly evaporate and the lane would read green having tested nothing —
        # the same class of blind spot that let the bug ship. `-rs` prints the
        # skip reason so an inert gate is visible in the log.
        env:
          # Overridable so a runner that cannot reach the public edge (CF bot-
          # protection 1010 on act_runner's client) can point at the internal
          # forge instead of silently skipping.
          MOLECULE_GITEA_BASE_URL: ${{ vars.MOLECULE_GITEA_API_HOST || 'https://git.moleculesai.app' }}
          # PROVIDER MATRIX (comma-separated declared-plugin sources, each pinned
          # to a commit SHA). The fetch + credential layers are provider-agnostic
          # — a source may name github, gitlab, or a customer's self-hosted forge
          # — so the live gate must be able to prove that on a forge that is NOT
          # ours, without a code change. Add one here and it is fetched for real:
          #   https://github.com/o/r#<sha>,https://gitlab.com/o/r#<sha>
          # Private repos authenticate through the same per-host token map the
          # runtime uses (MOLECULE_GIT_TOKENS / MOLECULE_GIT_TOKEN__<HOST>), so
          # this exercises multi-forge credentials too. Empty = no extra forge
          # configured; the parametrize then yields no cases and says so.
          MOLECULE_PLUGIN_E2E_SOURCES: ${{ vars.MOLECULE_PLUGIN_E2E_SOURCES }}
          MOLECULE_GIT_TOKENS: ${{ secrets.MOLECULE_GIT_TOKENS }}
        run: pytest -v -rs tests/integration/test_plugin_fetch_live_gitea.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        # HERMETIC (CI-robustness): no PIP_INDEX_URL=private override. Every
        # dep here is PUBLIC (ruff/build/twine/pytest/a2a-sdk/starlette/uvicorn)
        # and the package under test is built from LOCAL source — the private
        # index served none of them, so cold-cache 404d the required gate.
        run: pip install ruff

      - name: Lint with ruff (syntax + obvious errors only)
        # Initial lint scope is intentionally narrow — E9 (syntax), F (pyflakes
        # errors only, not warnings). Broadening to full ruff rules is a
        # follow-up task once the SSOT settles.
        run: ruff check --select=E9,F63,F7,F82 molecule_runtime/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        # HERMETIC (CI-robustness): no PIP_INDEX_URL=private override. Every
        # dep here is PUBLIC (ruff/build/twine/pytest/a2a-sdk/starlette/uvicorn)
        # and the package under test is built from LOCAL source — the private
        # index served none of them, so cold-cache 404d the required gate.
        run: pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check dist/*

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5  # v3
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  smoke-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Build local wheel for smoke install
        # HERMETIC (CI-robustness): no PIP_INDEX_URL=private override. Every
        # dep here is PUBLIC (ruff/build/twine/pytest/a2a-sdk/starlette/uvicorn)
        # and the package under test is built from LOCAL source — the private
        # index served none of them, so cold-cache 404d the required gate.
        run: |
          pip install build
          python -m build --wheel

      - name: Install wheel in clean venv + smoke-import
        # HERMETIC (CI-robustness): no PIP_INDEX_URL=private override. Every
        # dep here is PUBLIC (ruff/build/twine/pytest/a2a-sdk/starlette/uvicorn)
        # and the package under test is built from LOCAL source — the private
        # index served none of them, so cold-cache 404d the required gate.
        run: |
          set -eu
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet dist/*.whl
          # Verify the package + the canonical multi-WS / runtime imports.
          /tmp/smoke-venv/bin/python -c "
          from molecule_runtime import executor_helpers
          from molecule_runtime.mcp_workspace_resolver import resolve_workspaces
          from molecule_runtime import mcp_cli
          from molecule_runtime.executor_helpers import extract_attached_files
          from molecule_runtime.llm_auth import normalise_llm_env
          from molecule_runtime.credential_helper import install_credential_helper
          from molecule_runtime.precommit_hook import install_pre_commit_hook
          import importlib
          import molecule_runtime.plugins_registry as canonical_registry
          legacy_registry = importlib.import_module('plugins_registry')
          assert legacy_registry.resolve is canonical_registry.resolve
          assert importlib.import_module('plugins_registry.builtins') is importlib.import_module('molecule_runtime.plugins_registry.builtins')
          assert importlib.import_module('plugins_registry.protocol') is importlib.import_module('molecule_runtime.plugins_registry.protocol')
          print('smoke-import: all canonical surfaces import cleanly')
          "
          # CLI entry-point — molecule-mcp must be installed + show help.
          /tmp/smoke-venv/bin/molecule-mcp --help | head -5

  # LIVE Langfuse trace smoke — the runtime end of the obs verification. The
  # per-PR hermetic emission test (tests/test_langfuse_emission.py, unit-tests
  # job) proves the OTLP bridge POSTs to the right endpoint with the right auth
  # WITHOUT a live Langfuse; this job proves a real emitted trace actually lands
  # in a reachable Langfuse, keyed off a run-id. It is GATED: with no Langfuse /
  # no Infisical keys (any generic runner, or a stack with Langfuse off) the
  # script SKIPs (exit 0) and never reds the lane — it only fails when Langfuse
  # IS up+configured but the trace never shows up. Runs for real only on the
  # on-box runner that can reach the local stack.
  obs-smoke:
    # Never expose the live Infisical identity to a PR-head checkout. This
    # smoke is an explicitly dispatched, reviewed-main operation only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Live Langfuse trace smoke (gated when Langfuse off)
        env:
          # SSOT: the smoke derives LANGFUSE_HOST/keys from Infisical when these
          # are present; empty on a runner without the identity → script SKIPs.
          INFISICAL_API: ${{ secrets.INFISICAL_API }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_WORKSPACE_ID: ${{ secrets.INFISICAL_WORKSPACE_ID }}
          INFISICAL_OBS_ENV: prod
        run: bash scripts/obs_smoke.sh
