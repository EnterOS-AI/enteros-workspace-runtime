[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# DISTRIBUTION (pip) name. Renamed 2026-06-30 from the legacy
# `molecule-ai-workspace-runtime` to close a dependency-confusion hole: the
# legacy dist name is SQUATTED on public PyPI (136 releases incl version-bombs
# like 0.1.999999), so any resolver that also sees public PyPI (the CLI
# one-liner's `--extra-index-url`, and the google-adk/hermes/openclaw template
# image builds) could be silently hijacked by a public publish of a higher
# version. `molecules-workspace-runtime` is NOT on public PyPI and resolves ONLY
# from our Gitea registry, so it is confusion-safe. The IMPORT package stays
# `molecule_runtime` (unchanged) — only the pip/dist name changed.
name = "molecules-workspace-runtime"

# 0.3.70 continues the runtime version line under the new dist name (last
# publish under the legacy name was 0.3.69). The publish workflow stamps the
# tag version at build time, so main's pyproject value is only the manual/local
# fallback.
version = "0.3.70"

description = "Molecule AI workspace runtime — shared infrastructure for all agent adapters"
requires-python = ">=3.11"
license = {text = "BSL-1.1"}
readme = "README.md"
dependencies = [
    # Migrated to a2a-sdk 1.x (KI-009). A2AStarletteApplication replaced by
    # Starlette route factory functions (create_agent_card_routes, create_jsonrpc_routes).
    "a2a-sdk[http-server]>=1.0.0,<2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "websockets>=12.0",
    # multipart/form-data parser — required for Starlette's Request.form() on
    # /internal/chat/uploads/ingest. Without it, Starlette raises AssertionError
    # when parsing multipart bodies, which the chat-upload handler surfaces as
    # an opaque 400. Mirrors the canonical pin from the monorepo workspace
    # requirements; >=0.0.27 avoids CVE-2024-53981 (DoS via malformed boundary).
    "python-multipart>=0.0.27",
    "pyyaml>=6.0",
    # Backs the ADVISORY plugin-manifest SSOT validation (molecule-core#3383,
    # manifest_ssot.py): plugin.yaml is validated at load
    # (plugins.load_plugin_manifest) and at boot-install
    # (plugin_sources.install_declared_plugins) against the vendored
    # molecule-ai-sdk schema (molecule_runtime/contracts/, draft 2020-12 via
    # Draft202012Validator). Promoted from the test extra to base because the
    # advisory gate runs in the RUNTIME, not just tests; manifest_ssot degrades
    # loudly (one logger.error, gate OFF) if it is somehow missing.
    "jsonschema>=4.18",
    "langchain-core>=0.3.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[project.optional-dependencies]
# SSOT contract bindings (molecule-contracts / RFC molecule-core#3285), published
# as `molecule-ai-contracts` on the gitea PyPI registry and generated from
# molecule-contracts/workspace-comms. Used ONLY for type-checking the
# register/heartbeat/A2A payloads (the TYPE_CHECKING-guarded imports in
# heartbeat.py, mcp_heartbeat.py, main.py, a2a_client.py) against the shared
# schema — NOT a runtime requirement, so it is intentionally kept out of the base
# `dependencies` to keep `pip install` / the wheel smoke-test green against plain
# PyPI (which does not carry this package). Install with the gitea index to
# type-check locally:
#   pip install "molecules-workspace-runtime[contracts]" \
#     --extra-index-url https://git.moleculesai.app/api/packages/molecule-ai/pypi/simple/
contracts = ["molecule-ai-contracts>=0.1.0"]

# Test deps. jsonschema (draft 2020-12 via Draft202012Validator +
# `referencing`, installed transitively) backs the offline workspace-comms
# schema-conformance gate (tests/test_workspace_comms_conformance.py), which
# replaced the retired cross-repo AST drift-checker
# (scripts/check_platform_comm_contract.py) with real-payload-vs-SSOT-schema
# validation. jsonschema is ALSO a base dependency now (promoted by the
# advisory plugin-manifest SSOT gate, molecule-core#3383) — kept listed here
# so the test extra stays self-describing about what the conformance gate
# needs even if the base pin ever moves.
test = ["pytest", "pytest-asyncio", "jsonschema>=4.18"]

[project.scripts]
molecule-runtime = "molecule_runtime.main:main_sync"
# External-runtime MCP server — operators running an agent outside the
# platform's container fleet (Claude Code, hermes, codex, etc.) install
# this wheel and run `molecule-mcp` locally. Same 8 platform tools as
# container-bound runtimes get via the auto-spawned MCP.
molecule-mcp = "molecule_runtime.mcp_cli:main"

[tool.ruff]
lint.ignore = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
include = ["molecule_runtime*", "plugins_registry*"]

[tool.setuptools.package-data]
# contracts/* ships the vendored plugin-manifest SSOT schema (+ PROVENANCE.md)
# that manifest_ssot.py loads via importlib.resources — it must be IN the wheel
# for the advisory gate (molecule-core#3383) to run offline in workspaces.
"molecule_runtime" = ["py.typed", "scripts/*.sh", "contracts/*.json", "contracts/*.md"]
"plugins_registry" = ["py.typed"]

[tool.ruff.lint.per-file-ignores]
# a2a_tools.py is the canonical re-export module — downstream consumers
# (platform_tools/registry.py, builtin_tools/delegation.py, tests) import
# tool handlers from here rather than from the submodules they were
# extracted into (RFC #2873). F401 is expected and correct.
"molecule_runtime/a2a_tools.py" = ["F401"]
