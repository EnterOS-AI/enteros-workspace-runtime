[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule-ai-workspace-runtime"

# 0.2.0 signals the SSOT migration — this repo became the editable
# source on 2026-05-20. Prior 0.1.x line was a monorepo-published
# mirror; 0.1.81 remains valid on PyPI for any consumer still pinned
# to it (additive release, not a yank).
version = "0.2.2"

description = "Molecule AI workspace runtime — shared infrastructure for all agent adapters"
requires-python = ">=3.11"
license = {text = "BSL-1.1"}
readme = "README.md"
dependencies = [
    # Migrated to a2a-sdk 1.x (KI-009). A2AStarletteApplication replaced by
    # Starlette route factory functions (create_agent_card_routes, create_jsonrpc_routes).
    "a2a-sdk[http-server]>=1.0.0,<2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "websockets>=12.0",
    # multipart/form-data parser — required for Starlette's Request.form() on
    # /internal/chat/uploads/ingest. Without it, Starlette raises AssertionError
    # when parsing multipart bodies, which the chat-upload handler surfaces as
    # an opaque 400. Mirrors the canonical pin from the monorepo workspace
    # requirements; >=0.0.27 avoids CVE-2024-53981 (DoS via malformed boundary).
    "python-multipart>=0.0.27",
    "pyyaml>=6.0",
    "langchain-core>=0.3.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "temporalio>=1.7.0",
]

[project.scripts]
molecule-runtime = "molecule_runtime.main:main_sync"
# External-runtime MCP server — operators running an agent outside the
# platform's container fleet (Claude Code, hermes, codex, etc.) install
# this wheel and run `molecule-mcp` locally. Same 8 platform tools as
# container-bound runtimes get via the auto-spawned MCP.
molecule-mcp = "molecule_runtime.mcp_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["molecule_runtime*", "plugins_registry*"]

[tool.setuptools.package-data]
"molecule_runtime" = ["py.typed", "scripts/*.sh"]
"plugins_registry" = ["py.typed"]
